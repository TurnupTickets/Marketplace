name: Deploy GH Pages preview

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static SPA bundle
        env:
          GH_PAGES_BASE: ${{ github.event.repository.name }}
          # Point the deployed preview at the real API. Override in repo variables
          # (Settings -> Secrets and variables -> Actions -> Variables) once known.
          VITE_API_URL: ${{ vars.VITE_API_URL }}
        run: bunx vite build

      - name: Add SPA fallback for client-side routing
        run: cp dist/client/index.html dist/client/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/client

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
